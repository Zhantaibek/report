stages:
  - build
  - deploy

# variables:
#   NODE_ENV: production
#   SSH_PORT: "22"

build:
  stage: build
  image: node:20
  tags:
    - quick-reports
  script:
    - npm ci
    - npm ci --prefix client
    - npm run build
  only:
    - main

deploy:
  stage: deploy
  image: alpine:latest
  tags:
    - quick-reports
  needs: ["build"]
  before_script:
    - apk add --no-cache openssh-client git
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts || true
  script:
    - |
      REMOTE_PATH="${REMOTE_APP_PATH:-/home/nysh/quick_reports}"
      ssh -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" "bash -s" <<REMOTE
      set -e
      if [ -d "${REMOTE_PATH}/.git" ]; then
        cd "${REMOTE_PATH}"
        git fetch origin
        git reset --hard origin/main
      else
        echo "No repo at ${REMOTE_PATH} - clone manually first"
        exit 1
      fi
      docker compose build --no-cache
      docker compose up -d
      docker compose exec -T app npm run db:migrate:node
      REMOTE
  only:
    - main
  when: on_success

