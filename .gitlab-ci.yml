stages:
  - build
  - deploy

variables:
  NODE_ENV: production
  SSH_PORT: "22"

build:
  stage: build
  image: node:20
  script:
    - npm ci
    - npm run build
  only:
    - main

deploy:
  stage: deploy
  image: alpine:3.19
  needs: ["build"]
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
  script:
    - >
      ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" << 'EOF'
      cd /home/nysh/quick_reports
      git fetch origin
      git reset --hard origin/main
      docker compose build --no-cache
      docker compose up -d
      docker compose exec app npm run db:migrate:node
      EOF
  only:
    - main
  when: on_success

