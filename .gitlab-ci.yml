stages:
  - build
  - deploy

# variables:
#   NODE_ENV: production
#   SSH_PORT: "22"

build:
  stage: build
  image: node:20
  tags:
    - quick-reports
  script:
    - npm ci
    - npm ci --prefix client
    - npm run build
  only:
    - main

deploy:
  stage: deploy
  image: alpine:latest
  tags:
    - quick-reports
  needs: ["build"]
  before_script:
    - apk add --no-cache openssh-client git
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - |
      if [ -f "$SSH_PRIVATE_KEY" ]; then
        cp "$SSH_PRIVATE_KEY" ~/.ssh/id_rsa
        sed -i 's/\r$//' ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-add ~/.ssh/id_rsa
      elif [ -n "$SSH_PRIVATE_KEY_B64" ]; then
        echo "$SSH_PRIVATE_KEY_B64" | tr -d '\n\r\t ' | base64 -d | ssh-add -
      else
        echo "ERROR: Set CI/CD variable. Option A: SSH_PRIVATE_KEY (Type=File), paste full private key. Option B: SSH_PRIVATE_KEY_B64, run on server: base64 -w 0 ~/.ssh/gitlab_ci_deploy and paste ONE line (no line breaks)."
        exit 1
      fi
    - ssh-keyscan -p "${SSH_PORT:-22}" "$SSH_HOST" >> ~/.ssh/known_hosts || true
  script:
    - |
      REMOTE_PATH="${REMOTE_APP_PATH:-/home/nysh/quick_reports}"
      ssh -p "${SSH_PORT:-22}" "$SSH_USER@$SSH_HOST" "bash -s" <<REMOTE
      set -e
      if [ -d "${REMOTE_PATH}/.git" ]; then
        cd "${REMOTE_PATH}"
        git fetch origin
        git reset --hard origin/main
      else
        echo "No repo at ${REMOTE_PATH} - clone manually first"
        exit 1
      fi
      docker compose build --no-cache
      docker compose up -d
      docker compose exec -T app npm run db:migrate:node
      REMOTE
  only:
    - main
  when: on_success

