services:
  app:
    build: .
    ports:
      - "80:3001"
    env_file: .env
    environment:
      NODE_ENV: production
      APP_DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${APP_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_DB: ${APP_DB_NAME:-quik_reports}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:-postgres} -d ${APP_DB_NAME:-quik_reports}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
